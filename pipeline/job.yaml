resources:
  jobs:
    preco_na_bomba:
      name: preco-na-bomba
      schedule:
        quartz_cron_expression: 0 0 6 ? * MON
        timezone_id: America/Sao_Paulo
      email_notifications:
        on_failure:
          - seu-email
      parameters:
        - name: semestres
          default: 2024-01,2024-02,2025-01,2025-02
      git_source:
        git_url: https://github.com/1Pereira/preco-na-bomba
        git_provider: gitHub
        git_branch: main
      tasks:
        - task_key: landing_to_bronze
          notebook_task:
            notebook_path: notebooks/Landing_to_Bronze
            source: GIT
          max_retries: 2
          min_retry_interval_millis: 300000
        - task_key: bronze_to_silver
          depends_on:
            - task_key: landing_to_bronze
          notebook_task:
            notebook_path: notebooks/Bronze_to_Silver
            source: GIT
        - task_key: silver_to_gold
          depends_on:
            - task_key: bronze_to_silver
          notebook_task:
            notebook_path: notebooks/Silver_to_Gold
            source: GIT